{% extends 'base.html' %}
{% block title %}Offline - InterviewAI Pro{% endblock %}
{% block content %}
<div class="container d-flex justify-content-center align-items-center min-vh-75">
    <div class="text-center">
        <div class="mb-4">
            <i class="bi bi-wifi-off text-muted" style="font-size: 5rem;"></i>
        </div>
        <h1 class="font-heading fw-bold text-light mb-3">You are offline</h1>
        <p class="text-secondary mb-4">It looks like you've lost your internet connection.<br>InterviewAI Pro requires a connection to communicate with the AI models.</p>
        <button onclick="window.location.reload()" class="btn btn-primary rounded-pill px-4">
            <i class="bi bi-arrow-clockwise me-2"></i>Try Again
        </button>
    </div>
</div>
{% endblock %}
